# Перевірки на кожен запит на злиття й на кожну зміну main (критерій «Автоматичні перевірки»).
name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  # назви задач «build» і «pr-title» — обов'язкові перевірки в правилах гілки main
  build:
    name: build
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Збирання (лише статичні файли)
        run: npm run build
      - name: Повнота вмісту й внутрішні посилання
        run: npm run check:content
      - name: Браузер для тестів
        run: npx playwright install --with-deps chromium
      - name: Автотести (навігація, мови, мобільний вигляд, клавіатура, axe)
        run: npm test
      - name: Lighthouse CI — мобільний і настільний профілі, медіана трьох запусків
        run: npm run lhci
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 14

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # назва запиту на злиття: «тип: опис з малої літери», напр. «content: новина про день відкритих дверей»
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            content
            style
            a11y
            perf
            test
            ci
            docs
            refactor
            build
            chore
            revert
          subjectPattern: ^[^A-ZА-ЯІЇЄҐ].+$
          subjectPatternError: 'Опис — з малої літери, напр. «content: новина про день відкритих дверей».'
