# Приклад для nginx. Сайт — лише статичні файли; жодних модулів чи бекенду не треба.
server {
    server_name ce.knu.ua;
    root /var/www/ce.knu.ua/current;      # або каталог, куди копіює MODE=rsync
    index index.html;
    charset utf-8;

    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location /en/ { try_files $uri $uri/ =404; error_page 404 /en/404/index.html; }

    # файли з хешем у назві (/_astro/...) не змінюються ніколи
    location /_astro/ { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* \.(?:html|xml)$ { add_header Cache-Control "public, max-age=300"; }
    # service worker перевіряється на оновлення щоразу; маніфест застосунку — з правильним типом
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location ~* \.webmanifest$ { types { application/manifest+json webmanifest; } }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;
}
